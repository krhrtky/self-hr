name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            コメントは日本語で記載してください。

            **必須手順: 以下の順序で実行してください**

            1. `mcp__github__create_pending_pull_request_review` でペンディングレビューを開始
            2. `mcp__github__get_pull_request_diff` でPRの差分を取得
            3. 各変更行に対して `mcp__github__add_pull_request_review_comment_to_pending_review` でインラインコメントを追加
            4. `mcp__github__submit_pending_pull_request_review` でレビューを送信

            **レビュー基準:**
            - 保守性の観点
            - 設計・アーキテクチャの妥当性
            - コード品質
            - 潜在的なバグ
            - セキュリティ上の懸念

            **インラインコメントの形式:**
            - 結論を最初に簡潔に述べる
            - その後に理由と具体的な改善提案を記載
            - 建設的で実用的なフィードバックに集中
            - 肯定的なコメントはインラインレビューでは避ける

            リポジトリのCLAUDE.mdを参考にしてスタイルや規約に従ってください。

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "mcp__github__create_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review"'

