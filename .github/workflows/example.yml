name: example.yml
on:
  workflow_dispatch:

jobs:
  example-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'
      - name: Generate config file
        id: generate-config-file
        working-directory: "infrastructure"
        run: |
          `cat <<EOF > config.tfbackend
          bucket = "${TF_VAR_REMOTE_STATE_BUCKET}"
          key    = "${TF_VAR_ENV}"
          region = "${TF_VAR_AWS_REGION}"
          EOF`
          echo "bucket = ${TF_VAR_REMOTE_STATE_BUCKET}"
          echo "key    = ${TF_VAR_ENV}"
          echo "region = ${TF_VAR_AWS_REGION}"
          cat config.tfbackend
          CONFIG_TFBACKEND_FILE=$(pwd)/config.tfbackend
          echo "config_tfbackend_file=$CONFIG_TFBACKEND_FILE" >> "$GITHUB_OUTPUT"
      - name: test
        id: test
        working-directory: "infrastructure"
        run: cat ${{ steps.generate-config-file.outputs.config_tfbackend_file }}

